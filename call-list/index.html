<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <title>Call list</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="heading-copy">
        <p class="eyebrow">CALL HISTORY</p>
        <h1>Calls</h1>
        <p class="intro">Review recent conversations and outcomes.</p>
      </div>
      <div class="count-badge" aria-live="polite"><span id="call-count">0</span> calls</div>
    </header>

    <section class="call-panel" aria-labelledby="list-heading">
      <div class="panel-top">
        <div>
          <h2 id="list-heading">All calls</h2>
          <p class="panel-hint">Search by caller name</p>
        </div>
        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8" />
            <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span class="visually-hidden">Search calls by name</span>
          <input id="search-input" type="search" placeholder="Search calls..." autocomplete="off">
          <kbd>/</kbd>
        </label>
      </div>
      <div id="call-list" class="call-list" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p>No calls found</p>
        <span>Try another name</span>
      </div>
    </section>
    <footer class="page-footer">Call history</footer>
  </main>
</body>
</html>
